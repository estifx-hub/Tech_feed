name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Arrange files
        run: mkdir -p lib && mv main.dart ads.dart data.dart lib/
      - name: Create Android project
        run: |
          flutter create --org com.example --project-name tech_feed --platforms=android tmp
          cp -r tmp/android ./android
          rm -rf tmp
      - name: AdMob test ID and minSdk
        run: |
          sed -i 's#<activity#<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n        <activity#' android/app/src/main/AndroidManifest.xml
          sed -i 's/flutter.minSdkVersion/23/' android/app/build.gradle*
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
